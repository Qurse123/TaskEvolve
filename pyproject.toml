[project]
name = "taskevolve"
version = "0.1.0"
description = "Cost-aware co-optimization of LLM agent harnesses on TAU2-bench"
requires-python = ">=3.12"
dependencies = [
    "tau2[knowledge,gym]",
    "jinja2>=3.1",
    "langfuse>=2.0",
    "litellm>=1.40",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv.sources]
tau2 = { path = "vendor/tau2-bench", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["target_agent", "benchmark", "results", "DB", "settings", "scripts", "iterator_agent"]
