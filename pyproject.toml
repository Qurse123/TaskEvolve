[project]
name = "taskevolve"
version = "0.1.0"
description = "Cost-aware co-optimization of LLM agent harnesses on TAU2-bench"
requires-python = ">=3.12"
dependencies = [
    "tau2[knowledge,gym]",
    "jinja2>=3.1",
    "litellm>=1.40",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
tau2 = { path = "vendor/tau2-bench", editable = true }

[tool.pytest.ini_options]
# Collection must stay inside our own suite. The vendored tau2-bench ships voice
# and streaming tests whose imports fail here, and pytest aborts the whole run on
# a collection error, so without this the suite does not start.
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["target_agent", "benchmark", "results", "settings", "scripts", "iterator_agent", "arm_d"]
