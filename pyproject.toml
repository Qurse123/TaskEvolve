[project]
name = "taskevolve"
version = "0.1.0"
description = "Cost-aware co-optimization of LLM agent harnesses on TAU2-bench"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "langfuse>=2.0",
    "litellm>=1.40",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["target_agent", "benchmark", "observability"]
